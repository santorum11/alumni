<div class="gj-page">
  <h1>Event Highlights</h1>

  <div class="gj-slider">
    <div
      class="gj-slide"
      *ngFor="let img of images; let i = index"
      [class.active]="i === currentIndex"
    >
      <img [src]="img.src" [alt]="img.alt" />
    </div>

    <button class="gj-nav prev" (click)="prev()">❮</button>
    <button class="gj-nav next" (click)="next()">❯</button>
  </div>
</div>
