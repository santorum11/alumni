<div class="inauguration-overlay" *ngIf="showInauguration">
  <div class="inauguration-card">
    <h1>Website Inauguration</h1>
    <p>
      With immense joy, we inaugurate the official<br />
      Mahalakshmi Nodal High School Alumni Portal.
    </p>
    <p class="inauguration-sub">
      Click the button below to unveil the website!
    </p>

    <button class="inauguration-btn" (click)="launchInauguration()">
      Launch Website 🎉
    </button>
  </div>
</div>

<div class="hero-over-banner">
  <!-- background slider -->
  <div class="hero-slider">
    <div
      class="hero-slide"
      *ngFor="let img of heroImages; let i = index"
      [class.active]="i === currentHeroIndex"
    >
      <img [src]="img" alt="Golden Jubilee banner {{ i + 1 }}" />
    </div>

    <button class="hero-nav prev" (click)="prevHero()">❮</button>
    <button class="hero-nav next" (click)="nextHero()">❯</button>
  </div>
